[package]
name = "eq_apo_device"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Replica"]

[dependencies]
eq_apo_core = { path = "../eq_apo_core" }
resona_apo = { path = "../resona_apo" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell_PropertiesSystem"
] }
