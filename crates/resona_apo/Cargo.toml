[package]
name = "resona_apo"
version = "1.3.1"
edition = "2021"
authors = ["ResonaDSP Team"]
description = "Native Windows System Audio Processing Object (sAPO) DLL"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eq_apo_core = { path = "../eq_apo_core" }
serde_json = "1.0"
nnnoiseless = "0.5"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", branch = "main", default-features = false, features = ["tract"] }
ndarray = "0.15"
# Pin tract-* to 0.21.4 to match DeepFilterNet's ndarray 0.15 & symbol_table API
tract-core = "=0.21.4"
tract-data = "=0.21.4"
tract-hir = "=0.21.4"
tract-linalg = "=0.21.4"
tract-nnef = "=0.21.4"
tract-onnx = "=0.21.4"
tract-onnx-opl = "=0.21.4"
tract-pulse = "=0.21.4"
tract-pulse-opl = "=0.21.4"
